schema_version: 1
experiment_id: numeric_fitting_bootstrap_vs_full_buffer_5seed
created: 2026-08-17
base_config: llm_modulo_cegis/configs/obstacle_avoid_gpt_diagnostic.yaml
frozen_hypothesis_bank: llm_modulo_cegis/outputs/gpt_safe_acquisition_final/hypothesis_bank.json
spatial_hypothesis_id: h_spatial_exclusion
seeds: [7, 19, 37, 73, 109]

arms:
  bootstrap_queries:
    trainer_bootstrap_queries: true
    description: Per-member, label-stratified bootstrap with replacement.
  full_buffer:
    trainer_bootstrap_queries: false
    description: Every ensemble member sees every trainable query in every fit.

controls:
  device: cpu
  violation_pooling_mode: all_states
  semantic_backend: frozen_bank
  freeze_revisions: true
  falsifier_objective: hard_margin
  false_unsafe_trust_radius: 0.32
  false_unsafe_radius_ladder: []
  safe_acquisition:
    reserve_label_seeking_queries: true
    minimum_safe_label_fraction: 0.40
    minimum_violation_label_fraction: 0.35
    maximum_label_balance_queries_per_round: 2
  oracle_queries_per_run: 26
  llm_interactions_per_run: 0
  warmup_queries: 14
  warmup_validation_per_label: 2
  final_calibration_per_label: 2
  trainable_query_records_per_run: 18
  benchmark_warmup_labels: {safe: 8, violation: 6}
  warmup_trajectory_hash_must_match_all_runs: true
  pythonhashseed_matches_numeric_seed: true
  torch_num_threads: 1
  omp_num_threads: 1
  mkl_num_threads: 1

statistical_unit: numeric_seed
paired_design: >-
  Each seed uses the same frozen semantic bank, deterministic warmup slate,
  hard single-0.32 falsifier, safe-query acquisition policy, Oracle budget,
  and code/input snapshot. Violation pooling is pinned to the historical
  all-state objective. The only configured arm difference is
  trainer.bootstrap_queries.

primary_metrics:
  - qualified_spatial_champion_seed_count
  - spatial_evidence_eligible_seed_count
  - spatial_final_public_safe_accuracy
  - spatial_final_public_violation_recall
  - spatial_final_public_expert_safe_rate
  - spatial_final_public_fit_expert_safe_rate
  - spatial_query_buffer_coverage

evaluation_only_diagnostics:
  - champion_iou
  - spatial_hypothesis_iou
  - spatial_hypothesis_false_safe_rate
  - spatial_hypothesis_false_unsafe_rate
  - These private-geometry diagnostics are reported but never enter method selection.

decision_rule:
  preferred_if_supported: full_buffer
  fallback: bootstrap_queries
  require_strict_qualified_spatial_champion_seed_gain: true
  public_safety_floors:
    spatial_safe_accuracy: 0.60
    spatial_expert_safe_rate: 0.90
    spatial_fit_expert_safe_rate: 0.90
  obvious_public_safety_degradation:
    paired_delta_min:
      spatial_safe_accuracy: -0.20
      spatial_expert_safe_rate: -0.25
      spatial_fit_expert_safe_rate: -0.20
    any_pass_to_fail_safety_floor_regression_is_degradation: true
  select_full_buffer_if: >-
    full_buffer has strictly more qualified spatial champions across the five
    paired seeds AND no paired seed has an obvious public-evidence safety
    degradation. Otherwise retain bootstrap_queries. IoU and private geometry
    are diagnostic only.

interpretation_limits:
  - Five fixed seeds support an engineering stability decision, not statistical significance.
  - Queries within a seed are not independent samples.
  - Later active-query pools may diverge because the numeric learners differ.
  - Last-outer-round evidence is public/prequential evidence, not private evaluation geometry.
  - Query-buffer coverage measures which labelled query records each spatial ensemble member receives; known-safe expert demonstrations are always fully included.
  - The experiment changes fitting coverage only; it does not add Oracle or LLM calls.
