seed: 7
device: cpu
task_description: >-
  Carry an open cup through lift, transport, and placement while following the
  requested height reference. Motion should remain gentle regardless of travel
  direction, and the cup should remain upright; rotation about the vertical axis
  is allowed. Infer the qualitative constraint structure and learn its unknown
  numerical boundaries.
data:
  dataset_dir: llm_modulo_cegis/data/CarryWaterActive/public/carrywater_active
  membership_oracle_path: llm_modulo_cegis/data/CarryWaterActive/private/carrywater_active/oracle.json
  inline_private_evaluation: false
output_dir: outputs/carrywater_active_q48_full_bank_seed7
semantic_reasoner:
  backend: frozen_bank
  hypothesis_bank: llm_modulo_cegis/configs/carrywater_active_smoke_bank.json
semantic:
  beam_width: 7
  prune_per_round: 0
  max_initial_hypotheses: 7
  allow_fallback: false
  max_composite_clauses: 3
model:
  hidden_dims: [32, 32]
  ensemble_size: 2
trainer:
  epochs: 80
  learning_rate: 0.003
  weight_decay: 0.00001
  margin: 0.2
  smoothmax_beta: 20.0
  expert_weight: 3.0
  query_weight: 1.0
  violation_weight: 2.0
  safe_state_weight: 1.5
  latent_witness_weight: 1.5
  latent_witness_fraction: 0.1
  output_regularization: 0.0001
  bootstrap_queries: false
  bootstrap_ensure_full_coverage: false
  violation_pooling_mode: all_states
evidence:
  linear_max_support_gate_enforced: true
  linear_max_support_tolerance: 0.00001
  linear_max_minimum_contradictory_anchors: 2
  minimum_per_label: 2
  complexity_penalty: 0.015
  capacity_penalty: 0.010
  uncertainty_penalty: 0.02
  champion_minimum_safe_accuracy: 0.60
  champion_minimum_violation_recall: 0.55
  champion_minimum_expert_safe_rate: 0.90
  champion_minimum_fit_expert_safe_rate: 0.90
  prequential_window_rounds: 2
  representation_collision_tolerance: 0.00001
  representation_collision_penalty: 1.0
falsifier:
  steps: 1
  smoothmax_beta: 20.0
  false_unsafe_trust_radius: 1.0
  false_unsafe_use_hard_margin: true
  false_unsafe_anchor_margin: 0.02
  false_unsafe_hard_margin: 0.05
  false_unsafe_radius_ladder: []
loop:
  warmup_queries: 12
  max_warmup_queries: 12
  minimum_label_count: 2
  minimum_safe_query_count: 2
  minimum_violation_query_count: 2
  warmup_validation_safe_count: 1
  warmup_validation_violation_count: 1
  final_calibration_safe_count: 1
  final_calibration_violation_count: 3
  expert_structure_validation: 2
  outer_rounds: 3
  queries_per_hypothesis: 0
  oracle_query_budget_per_round: 12
  candidate_pool_per_hypothesis: 7
  query_hypothesis_beam: 7
  candidate_history_deduplication_rms: 0.0001
  minimum_safe_label_fraction: 0.40
  minimum_violation_label_fraction: 0.35
  reserve_label_seeking_queries: true
  maximum_label_balance_queries_per_round: 2
  calibrate_decision_threshold_during_cegis: true
  decision_threshold_minimum_per_label: 1
  decision_threshold_minimum_fit_expert_safe_rate: 0.90
  safe_query_boundary_bisection_steps: 0
  falsifier_restarts: 1
  grid_resolution: 16
  freeze_revisions: true
  maximum_active_hypotheses: 7
  retain_best_qualified_checkpoint: true
  require_full_round_budget: true
